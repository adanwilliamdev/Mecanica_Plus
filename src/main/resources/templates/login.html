<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · Torque Gestão</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="login">
    <div class="hero">
        <a class="brand" style="padding:0" th:href="@{/login}">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/></svg>
            Torque Gestão
        </a>
        <div>
            <h2>Cada ordem de serviço, cada peça, cada cliente — em um só lugar.</h2>
            <p style="margin-top:16px">Sistema de gestão para oficinas que levam a operação a sério.</p>
        </div>
    </div>
    <div class="panel">
        <div class="box">
            <h2>Entrar</h2>
            <p class="muted" style="margin:6px 0 22px">Acesse o painel de gestão da sua oficina.</p>

            <div class="alert error" role="alert" th:if="${param.error}">Email ou senha inválidos</div>
            <div class="alert error" role="alert" th:if="${param.rate}">Muitas tentativas. Aguarde um instante e tente novamente.</div>
            <div class="alert success" role="status" th:if="${param.logout}">Você saiu do sistema.</div>

            <form th:action="@{/login}" method="post">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@oficina.com" required autofocus>
                </div>
                <div class="field">
                    <label for="password">Senha</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn" style="width:100%;margin-top:6px">Entrar</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
