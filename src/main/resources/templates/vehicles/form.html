<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${editingId != null ? 'Editar veículo' : 'Novo veículo'}, ~{::main})}">
<body>
<main>
  <div class="page-header">
    <div><h1 th:text="${editingId != null} ? 'Editar veículo' : 'Novo veículo'">Novo veículo</h1></div>
  </div>
  <form class="card form-card" method="post" th:object="${form}"
        th:action="${editingId != null} ? @{/vehicles/{id}(id=${editingId})} : @{/vehicles}">
    <div class="alert error" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
    <div class="field">
      <label for="clientId">Cliente *</label>
      <select id="clientId" th:field="*{clientId}">
        <option value="">Selecione um cliente</option>
        <option th:each="c : ${clients}" th:value="${c.id()}" th:text="${c.name()}">Cliente</option>
      </select>
      <span class="field-error" th:if="${#fields.hasErrors('clientId')}" th:errors="*{clientId}"></span>
    </div>
    <div class="field">
      <label for="plate">Placa *</label>
      <input id="plate" type="text" th:field="*{plate}" placeholder="ABC1D23" maxlength="8">
      <span class="field-error" th:if="${#fields.hasErrors('plate')}" th:errors="*{plate}"></span>
    </div>
    <div class="row">
      <div class="field">
        <label for="brand">Marca *</label>
        <input id="brand" type="text" th:field="*{brand}">
        <span class="field-error" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></span>
      </div>
      <div class="field">
        <label for="model">Modelo *</label>
        <input id="model" type="text" th:field="*{model}">
        <span class="field-error" th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></span>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="year">Ano *</label>
        <input id="year" type="number" th:field="*{year}">
        <span class="field-error" th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></span>
      </div>
      <div class="field">
        <label for="mileage">Quilometragem</label>
        <input id="mileage" type="number" min="0" th:field="*{mileage}">
        <span class="field-error" th:if="${#fields.hasErrors('mileage')}" th:errors="*{mileage}"></span>
      </div>
    </div>
    <div class="field">
      <label for="fuelType">Combustível</label>
      <input id="fuelType" type="text" th:field="*{fuelType}" placeholder="Flex, Gasolina, Diesel...">
    </div>
    <div class="form-actions">
      <a class="btn secondary" th:href="@{/vehicles}">Cancelar</a>
      <button class="btn" type="submit" th:text="${editingId != null} ? 'Atualizar' : 'Criar'">Criar</button>
    </div>
  </form>
</main>
</body>
</html>
