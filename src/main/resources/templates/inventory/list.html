<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Estoque', ~{::main})}">
<body>
<main>
  <div class="page-header">
    <div>
      <h1>Estoque</h1>
      <p>Controle de peças e movimentações</p>
    </div>
    <a class="btn" th:href="@{/inventory/new}">+ Nova Peça</a>
  </div>
  <div class="card table-wrap">
    <table>
      <thead>
        <tr><th>Código</th><th>Nome</th><th>Fabricante</th><th class="num">Estoque</th><th class="num">Preço de venda</th><th>Status</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="p : ${parts}">
          <td class="mono strong" th:text="${p.code()}">COD</td>
          <td class="strong" th:text="${p.name()}">Peça</td>
          <td th:text="${@fmt.dash(p.manufacturer())}">—</td>
          <td class="num mono" th:text="${p.stockQuantity()}">0</td>
          <td class="num mono" th:text="${@fmt.currency(p.salePrice())}">R$ 0,00</td>
          <td><span class="badge" th:classappend="${p.lowStock()} ? 'rust' : 'moss'" th:text="${p.lowStock()} ? 'Estoque baixo' : 'Em estoque'">Em estoque</span></td>
          <td>
            <div class="actions">
              <a class="btn link" th:href="@{/inventory/{id}/edit(id=${p.id()})}">Editar</a>
              <a class="btn link" th:href="@{/inventory/{id}/stock(id=${p.id()},kind='ENTRADA')}">Entrada</a>
              <a class="btn link" th:href="@{/inventory/{id}/stock(id=${p.id()},kind='SAIDA')}">Saída</a>
              <form th:action="@{/inventory/{id}/delete(id=${p.id()})}" method="post"
                    th:attr="data-confirm='Tem certeza que deseja excluir ' + ${p.name()} + '?'">
                <button class="btn link danger" type="submit">Excluir</button>
              </form>
            </div>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(parts)}"><td class="empty" colspan="7">Nenhuma peça cadastrada</td></tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
