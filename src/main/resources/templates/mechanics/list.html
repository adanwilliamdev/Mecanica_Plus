<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout('Mecânicos', ~{::main})}">
<body>
<main>
  <div class="page-header">
    <div>
      <h1>Mecânicos</h1>
      <p>Gerencie a equipe de mecânicos da oficina</p>
    </div>
    <a class="btn" th:href="@{/mechanics/new}" sec:authorize="hasAnyRole('ADMIN','MANAGER')">+ Novo Mecânico</a>
  </div>
  <div class="card table-wrap">
    <table>
      <thead>
        <tr><th>Nome</th><th>Especialidade</th><th>Telefone</th><th>Disponibilidade</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="m : ${mechanics}">
          <td class="strong" th:text="${m.name()}">Nome</td>
          <td th:text="${@fmt.dash(m.specialty())}">—</td>
          <td th:text="${@fmt.phone(m.phone())}">—</td>
          <td><span class="badge" th:classappend="${m.available()} ? 'moss' : 'neutral'" th:text="${m.available()} ? 'Disponível' : 'Indisponível'">Disponível</span></td>
          <td>
            <div class="actions" sec:authorize="hasAnyRole('ADMIN','MANAGER')">
              <a class="btn link" th:href="@{/mechanics/{id}/edit(id=${m.id()})}">Editar</a>
              <form th:action="@{/mechanics/{id}/availability(id=${m.id()})}" method="post">
                <button class="btn link" type="submit">Alternar disponibilidade</button>
              </form>
              <form th:action="@{/mechanics/{id}/delete(id=${m.id()})}" method="post"
                    th:attr="data-confirm='Tem certeza que deseja excluir ' + ${m.name()} + '?'">
                <button class="btn link danger" type="submit">Excluir</button>
              </form>
            </div>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(mechanics)}"><td class="empty" colspan="5">Nenhum mecânico cadastrado</td></tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
